<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16110a" />
    <meta name="description" content="Dračí doupě USA — politické dobrodružství ve stylu Dračího doupěte: od zakladatele firmy k Bílému domu. Herní mistr Mistral AI vypráví a převádí záměry do herních akcí; hratelné bez registrace." />
    <title>Dračí doupě USA — politické dobrodružství</title>
    <script>
      /* Tailwind CDN s náhradní adresou; výpadek stylů hru nepřeruší. */
      (function () {
        var n = document.createElement("script");
        n.src = "https://cdn.tailwindcss.com";
        n.onerror = function () {
          var f = document.createElement("script");
          f.src = "https://cdn.jsdelivr.net/npm/tailwindcss-cdn@0.0.1/cdn.min.js";
          document.head.appendChild(f);
        };
        document.head.appendChild(n);
      })();
    </script>
    <script src="./react.production.min.js"></script>
    <script src="./react-dom.production.min.js"></script>
    <style>
      body { margin: 0; background: radial-gradient(1100px 500px at 50% -10%, #2a1c0e 0%, #16110a 55%, #100c07 100%); color: #f2e8cf; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      h1, h2, h3, summary { font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; letter-spacing: 0.01em; }
      #nacitani { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
      #nacitani .pruh { width: 200px; height: 6px; border-radius: 9999px; background: #33270f; overflow: hidden; }
      #nacitani .vypln { height: 100%; width: 40%; border-radius: 9999px; background: linear-gradient(90deg, #f59e0b, #fbbf24); animation: nacitani 1.1s ease-in-out infinite; }
      @keyframes nacitani { 0% { transform: translateX(-100%);} 100% { transform: translateX(350%);} }
      #diagnostika { display: none; position: fixed; left: 12px; bottom: 12px; right: 12px; max-width: 560px; margin: 0 auto; padding: 12px 16px; border-radius: 12px; background: #450a0a; color: #fecaca; font-size: 13px; line-height: 1.5; z-index: 50; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="nacitani">
        <div style="font-weight: 800; letter-spacing: 0.14em; font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif; color: #f2e8cf;">DRAČÍ DOUPĚ USA</div>
        <div class="pruh"><div class="vypln"></div></div>
        <div style="font-size: 12px; color: #b6a780;">Herní mistr otevírá doupě…</div>
      </div>
    </div>
    <div id="diagnostika"></div>
    <script>
      function ukazChybu(txt) {
        var d = document.getElementById("diagnostika");
        if (!d) return;
        d.style.display = "block";
        d.textContent = txt;
      }
      window.addEventListener("error", function (e) {
        ukazChybu("Běh hry narazil na chybu: " + (e.message || "neznámá chyba"));
      });
    </script>
    <script src="./app.js" onerror="ukazChybu('Nepodařilo se stáhnout soubor hry (app.js). Zkuste obnovit stránku.')"></script>
    <script>
      if (typeof window.__render === "function") {
        try {
          window.__render();
        } catch (e) {
          ukazChybu("Hra se nespustila: " + (e && e.message ? e.message : e));
        }
      } else {
        ukazChybu("Hra se nenačetla — chybí přeložený soubor hry. Zkuste obnovit stránku (Ctrl+Shift+R).");
      }
    </script>
  </body>
</html>
